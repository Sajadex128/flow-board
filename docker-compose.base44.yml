# Base44 sandbox runbook.
#
# Runs the Next.js app from the cloned source with live reload. Dependencies are
# installed into the image (Dockerfile.base44) and kept in a named volume so the
# bind-mounted source does not shadow them.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.base44
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        npx prisma generate
        exec npx next dev -H 0.0.0.0 -p 3000
    env_file:
      # Placeholders first, platform-provided secrets last (they always win).
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      # Passed through from the sandbox so the app can allow-list the preview
      # host/origin. Values are never hardcoded.
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    restart: on-failure
    labels:
      base44.project: "Happiness Storefront"
      base44.kind: "web"
      base44.port: "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 120s

volumes:
  node_modules:
